<body>
       <div class="container">
        <header>
            <h1>Kalkulator Bangun Ruang Sisi Lengkung</h1>
            <p>Hitung volume, luas permukaan, dan luas selimut dengan langkah penyelesaian</p>
        </header>

        <main>
            <div class="bangun-pilihan">
                <button class="tab-btn active" data-bangun="tabung">Tabung</button>
                <button class="tab-btn" data-bangun="kerucut">Kerucut</button>
                <button class="tab-btn" data-bangun="bola">Bola</button>
            </div>

            <!-- FORM TABUNG -->
            <div id="tabung-form" class="bangun-form active">
                <h2>Tabung</h2>
                <div class="form-group">
                    <label for="tabung-jenis">Jenis Perhitungan:</label>
                    <select id="tabung-jenis" class="form-control">
                        <option value="volume_luas">Hitung Volume & Luas</option>
                        <option value="jari_volume">Cari Jari-jari dari Volume</option>
                        <option value="tinggi_volume">Cari Tinggi dari Volume</option>
                        <option value="jari_luas_selimut">Cari Jari-jari dari Luas Selimut</option>
                        <option value="tinggi_luas_selimut">Cari Tinggi dari Luas Selimut</option>
                        <option value="jari_luas_permukaan">Cari Jari-jari dari Luas Permukaan</option>
                        <option value="tinggi_luas_permukaan">Cari Tinggi dari Luas Permukaan</option>
                    </select>
                </div>

                <div class="input-group">
                    <div class="input-field">
                        <label for="tabung-jari">Jari-jari (cm):</label>
                        <input type="number" id="tabung-jari" step="any" placeholder="Masukkan jari-jari">
                    </div>
                    <div class="input-field">
                        <label for="tabung-tinggi">Tinggi (cm):</label>
                        <input type="number" id="tabung-tinggi" step="any" placeholder="Masukkan tinggi">
                    </div>
                    <div class="input-field">
                        <label for="tabung-volume">Volume (cm³):</label>
                        <input type="number" id="tabung-volume" step="any" placeholder="Masukkan volume">
                    </div>
                    <div class="input-field">
                        <label for="tabung-luas-selimut">Luas Selimut (cm²):</label>
                        <input type="number" id="tabung-luas-selimut" step="any" placeholder="Masukkan luas selimut">
                    </div>
                    <div class="input-field">
                        <label for="tabung-luas-permukaan">Luas Permukaan (cm²):</label>
                        <input type="number" id="tabung-luas-permukaan" step="any" placeholder="Masukkan luas permukaan">
                    </div>
                </div>

                <button onclick="hitungTabung()" class="btn-hitung">Hitung</button>
            </div>

            <!-- FORM KERUCUT -->
            <div id="kerucut-form" class="bangun-form">
                <h2>Kerucut</h2>
                <div class="form-group">
                    <label for="kerucut-jenis">Jenis Perhitungan:</label>
                    <select id="kerucut-jenis" class="form-control">
                        <option value="volume_luas">Hitung Volume & Luas</option>
                        <option value="jari_volume">Cari Jari-jari dari Volume</option>
                        <option value="tinggi_volume">Cari Tinggi dari Volume</option>
                        <option value="jari_luas_selimut">Cari Jari-jari dari Luas Selimut</option>
                        <option value="tinggi_luas_selimut">Cari Tinggi dari Luas Selimut</option>
                        <option value="jari_luas_permukaan">Cari Jari-jari dari Luas Permukaan</option>
                        <option value="tinggi_luas_permukaan">Cari Tinggi dari Luas Permukaan</option>
                    </select>
                </div>

                <div class="input-group">
                    <div class="input-field">
                        <label for="kerucut-jari">Jari-jari (cm):</label>
                        <input type="number" id="kerucut-jari" step="any" placeholder="Masukkan jari-jari">
                    </div>
                    <div class="input-field">
                        <label for="kerucut-tinggi">Tinggi (cm):</label>
                        <input type="number" id="kerucut-tinggi" step="any" placeholder="Masukkan tinggi">
                    </div>
                    <div class="input-field">
                        <label for="kerucut-volume">Volume (cm³):</label>
                        <input type="number" id="kerucut-volume" step="any" placeholder="Masukkan volume">
                    </div>
                    <div class="input-field">
                        <label for="kerucut-luas-selimut">Luas Selimut (cm²):</label>
                        <input type="number" id="kerucut-luas-selimut" step="any" placeholder="Masukkan luas selimut">
                    </div>
                    <div class="input-field">
                        <label for="kerucut-luas-permukaan">Luas Permukaan (cm²):</label>
                        <input type="number" id="kerucut-luas-permukaan" step="any" placeholder="Masukkan luas permukaan">
                    </div>
                </div>

                <button onclick="hitungKerucut()" class="btn-hitung">Hitung</button>
            </div>

            <!-- FORM BOLA -->
            <div id="bola-form" class="bangun-form">
                <h2>Bola</h2>
                <div class="form-group">
                    <label for="bola-jenis">Jenis Perhitungan:</label>
                    <select id="bola-jenis" class="form-control">
                        <option value="volume_luas">Hitung Volume & Luas</option>
                        <option value="jari_volume">Cari Jari-jari dari Volume</option>
                        <option value="jari_luas_permukaan">Cari Jari-jari dari Luas Permukaan</option>
                    </select>
                </div>

                <div class="input-group">
                    <div class="input-field">
                        <label for="bola-jari">Jari-jari (cm):</label>
                        <input type="number" id="bola-jari" step="any" placeholder="Masukkan jari-jari">
                    </div>
                    <div class="input-field">
                        <label for="bola-volume">Volume (cm³):</label>
                        <input type="number" id="bola-volume" step="any" placeholder="Masukkan volume">
                    </div>
                    <div class="input-field">
                        <label for="bola-luas-permukaan">Luas Permukaan (cm²):</label>
                        <input type="number" id="bola-luas-permukaan" step="any" placeholder="Masukkan luas permukaan">
                    </div>
                </div>

                <button onclick="hitungBola()" class="btn-hitung">Hitung</button>
            </div>

            <!-- HASIL PERHITUNGAN -->
            <div id="hasil" class="hasil-container" aria-live="polite">
                <h3>Hasil Perhitungan</h3>
                <div id="hasil-nilai" class="hasil-nilai"></div>
                <div id="langkah-penyelesaian" class="langkah-penyelesaian"></div>
            </div>
